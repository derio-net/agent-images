schema_version: 2
profiles:
  dev:
    purpose: 'Day-to-day dev on agent-images: edit Dockerfiles/docs/shell, run bats
      MOTD tests + pytest locally; GitHub ops on host'
    secrets: []
default: dev
forge:
  type: github
# none: build.yaml runs on push to main / dispatch only, never on a PR, so no CI
# run can vouch for a branch. Test evidence is a local log or is recorded at
# close-out. Flip to github-actions if build.yaml gains a pull_request trigger
# (.fr/ci.yaml already names the gate checks).
ci:
  type: none
tracking:
  type: github
