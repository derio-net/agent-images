          echo "$out" | grep -q 'failed=0' || { echo "✗ empty-inventory reconcile reported failed>0"; exit 1; }
          docker exec infra-smoke test -s /var/lib/infra-shell/last-reconcile.motd

          # Auth-status MOTD drop-in must be present and executable.
          docker exec infra-smoke test -x /etc/profile.d/50-infra-shell-motd.sh
          docker exec infra-smoke /etc/profile.d/50-infra-shell-motd.sh | grep -q '✗ claude'

      # Cluster-admin tooling — the only thing infra-shell adds on top of
      # multi-agent-shell. All three must be on PATH and runnable as UID 1000.
      - name: kubectl --client
        run: docker exec infra-smoke kubectl version --client
      - name: talosctl --client
        run: docker exec infra-smoke talosctl version --client
      - name: omnictl --version
        run: docker exec infra-smoke omnictl --version

      - name: Cleanup
        if: always()
        run: |
          docker logs infra-smoke || true
          docker rm -f infra-smoke || true

  dispatch-frank:
    needs:
      - test-kali
      - test-multi-agent-shell
      - build-children
      - smoke-test-vk-local
      # NOT smoke-test-secure-agent-kali (deliberately dropped): kali is the
      # known-flaky Kali-rolling leg (t64 / GCC churn). Gating the frank bump on
      # it means one kali break starves EVERY image's delivery to frank. The kali
      # build leg is soft (build-children.continue-on-error) and its smoke stays a
      # hard signal, but the bump no longer waits on it. Safe because frank's
      # agent-images-bump handler pins per-image by GHCR tag existence, so it
      # skips kali at a SHA where kali did not publish (no ImagePullBackOff).
      - smoke-test-paperclip-shell
      - smoke-test-ruflo-shell
      - smoke-test-ruflo-server
      - smoke-test-multi-agent-shell
      - smoke-test-hermes-agent-shell
      - smoke-test-hermes-agent-shell-ssh
      - smoke-test-hermes-agent-shell-hindsight
      - smoke-test-infra-shell
    runs-on: ubuntu-latest
    # Only notify frank when the MAIN image tag actually moved: a push to main
    # or the vk repository_dispatch rebuild. A manual workflow_dispatch (used to
    # validate a feature BRANCH image before merge) must NOT bump frank — its
    # handler sed-pins frank's prod manifests to the dispatched SHA and opens a
    # PR, which would pin production to an unmerged branch build.
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          gh api repos/derio-net/frank/dispatches \
            -f event_type=agent-images-bumped \
            -f client_payload[agent_images_sha]=$GITHUB_SHA
