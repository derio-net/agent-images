name: Build agent images

on:
  push:
    branches: [main]
    # Skip rebuilds for docs-only changes (plans, specs, findings).
    # Mixed commits still trigger: paths-ignore matches only when ALL
    # changed files are ignored. workflow_dispatch and repository_dispatch
    # bypass these filters, so manual/external triggers still rebuild.
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
  repository_dispatch:
    types: [vibe-kanban-build-updated]

env:
  REGISTRY: ghcr.io
  OWNER: derio-net

jobs:
  test-kali:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --group dev
      - name: Run kali shell tests
        run: |
          fail=0
          for t in kali/tests/test_*.sh; do
            echo "::group::$t"
            bash "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Run kali Python tests
        working-directory: kali
        run: uv run pytest tests/ -v

  # The baked agent-session driver (multi-agent-shell/rootfs/.../agent-session)
  # is exercised by a tmux-mock pytest suite ported from frank. Mirrors the
  # test-kali Python step; gates the frank dispatch alongside test-kali.
  test-multi-agent-shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --group dev
      - name: Run multi-agent-shell Python tests
        working-directory: multi-agent-shell
        run: uv run pytest tests/ -v

  build-base:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/agent-base:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/agent-base:latest
          cache-from: type=gha,scope=agent-base
          cache-to: type=gha,scope=agent-base,mode=max

  build-shell-base:
    needs: build-base
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: agent-shell-base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/agent-shell-base:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/agent-shell-base:latest
          build-args: BASE_SHA=${{ needs.build-base.outputs.sha }}
          cache-from: type=gha,scope=agent-shell-base
          cache-to: type=gha,scope=agent-shell-base,mode=max

  # multi-agent-shell is a SECOND intermediate base — Phase 3 infra-shell
  # builds FROM ghcr.io/derio-net/multi-agent-shell:<sha>. Mirrors the
  # build-shell-base shape so downstream `needs.build-multi-agent-shell.outputs.sha`
  # references work in the same idiomatic way.
  build-multi-agent-shell:
    needs: build-shell-base
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: multi-agent-shell
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/multi-agent-shell:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/multi-agent-shell:latest
          build-args: BASE_SHA=${{ needs.build-shell-base.outputs.sha }}
          cache-from: type=gha,scope=multi-agent-shell
          cache-to: type=gha,scope=multi-agent-shell,mode=max

  build-children:
    needs: [build-base, build-shell-base, build-multi-agent-shell]
    runs-on: ubuntu-latest
    # secure-agent-kali is the one child that periodically breaks on Kali-rolling
    # transitions (t64, GCC churn) — a flake unrelated to every other image. Make
    # ONLY its matrix leg soft (fail-fast:false above already keeps a kali failure
    # from cancelling the sibling builds) so a broken kali build no longer fails
    # build-children and starves the downstream smokes + the frank auto-bump. The
    # kali SMOKE stays hard (a real regression still reds the run), and
    # dispatch-frank no longer needs it (see its needs: below); frank's bump
    # handler pins per-image by GHCR tag existence, so it skips any image not
    # actually published at the SHA.
    continue-on-error: ${{ matrix.image.name == 'secure-agent-kali' }}
    strategy:
      # One child's external flake (e.g. ruflo-server's build-time
      # router.huggingface.co fetch returning 429, #115) must not cancel the
      # unrelated sibling builds mid-push.
      fail-fast: false
      matrix:
        image:
          - name: secure-agent-kali
            context: kali
            build_args: |
              BASE_SHA=${{ needs.build-shell-base.outputs.sha }}
          - name: vk-local
            context: vk-local
            build_args: |
              AGENT_BASE_SHA=${{ needs.build-base.outputs.sha }}
              VK_FORK_SHA=${{ github.event.client_payload.vk_fork_sha || 'latest' }}
          - name: paperclip-shell
            context: paperclip-shell
            build_args: |
              BASE_SHA=${{ needs.build-shell-base.outputs.sha }}
          - name: ruflo-shell
            context: ruflo-shell
            build_args: |
              BASE_SHA=${{ needs.build-shell-base.outputs.sha }}
          - name: ruflo-server
            context: ruflo-server
            build_args: ""
          - name: hermes-agent-shell
            context: hermes-agent-shell
            build_args: |
              BASE_SHA=${{ needs.build-shell-base.outputs.sha }}
          # Thin SSH/Mosh sidecar for the two-container hermes-agent-shell pod
          # (willikins#285). Unlike its single-container sibling above, this image
          # builds FROM the official docker.io/nousresearch/hermes-agent tag
          # (HERMES_TAG arg, defaulted in the Dockerfile) — NOT the agent-shell-base
          # chain — so it carries no BASE_SHA, same as ruflo-server. It still runs
          # in build-children (which needs the base chain) for matrix uniformity;
          # the unused base deps just mean it waits a little, harmless.
          - name: hermes-agent-shell-ssh
            context: hermes-agent-shell-ssh
            build_args: ""
          - name: hermes-agent-shell-hindsight
            context: hermes-agent-shell-hindsight
            build_args: |
              BASE_SHA=${{ needs.build-multi-agent-shell.outputs.sha }}
          - name: infra-shell
            context: infra-shell
            build_args: |
              BASE_SHA=${{ needs.build-multi-agent-shell.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}:latest
          build-args: ${{ matrix.image.build_args }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  smoke-test-vk-local:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VK_IMAGE: ghcr.io/derio-net/vk-local
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — entrypoint wrapper runs init.d scripts
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # The mount target is owned by the runner (root); chown to UID 1000
          # so the in-container claude user (also UID 1000) can write into it.
          # Without this, the init scripts hit EACCES on mkdir.
          mkdir -p /tmp/test-home
          sudo chown 1000:1000 /tmp/test-home
          # Run the shared init scripts directly (bypass vibe-kanban startup so
          # the test stays environment-free). Verifies:
          #   1. /opt/agent-init.d/* scripts are present and executable
          #   2. 01-pvc-dirs creates $HOME/repos and other expected dirs
          #   3. Wrapper iterates scripts correctly as the claude user
          docker run --rm \
            --user 1000:1000 \
            -v /tmp/test-home:/home/claude \
            --entrypoint /bin/sh \
            "${VK_IMAGE}:${IMAGE_SHA}" \
            -c 'for s in /opt/agent-init.d/*; do [ -x "$s" ] && "$s"; done && ls /home/claude/repos /home/claude/.ssh'

  smoke-test-secure-agent-kali:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      KALI_IMAGE: ghcr.io/derio-net/secure-agent-kali
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — s6-overlay /init under K8s-equivalent securityContext
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # Match the live secure-agent-pod securityContext so the s6-overlay
          # preinit hits the same /run constraints it does in K8s. Without
          # --cap-drop=ALL --security-opt=no-new-privileges, suexec can chown
          # /run at runtime and the test cannot detect missing image-side chowns.
          mkdir -p /tmp/kali-home
          sudo chown 1000:1000 /tmp/kali-home
          docker run -d --name kali-smoke \
            --user 1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -v /tmp/kali-home:/home/claude \
            "${KALI_IMAGE}:${IMAGE_SHA}"
          # /init must reach stage 2 (services up). Budget bumped to 90s
          # because cont-init.d/55-install-fr-bridge now does a `uv tool
          # install` from a git tag on first boot — pulls the fr source +
          # transitive deps from PyPI before sshd starts. Steady-state
          # boots are still ~3s once fr is on the PVC; the 90s budget is
          # for the first run against an empty volume (CI is always first).
          # s6-overlay v3 installs binaries under /command/ — the agent-base
          # PATH does not include it, so we must call s6-svstat by full path.
          for i in $(seq 1 90); do
            if docker exec kali-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
              echo "✓ s6-overlay started, sshd is up"
              break
            fi
            sleep 1
          done
          if ! docker exec kali-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
            echo "✗ s6-overlay did not bring sshd up within 90s"
            docker logs kali-smoke
            docker rm -f kali-smoke
            exit 1
          fi

          # Bridge wrapper smoke: cron invokes $HOME/.local/bin/fr-bridge
          # (the wrapper written by cont-init.d/55-install-fr-bridge). The
          # banner version must match the image's FR_BRIDGE_PIN — this is
          # what proves the init script reconciled to the pinned tag rather
          # than silently keeping a stale PVC install.
          # Capture stderr (2>&1): the bridge (fr_vk.bridge module) emits its
          # banner + "dry-run complete" via logging, which goes to STDERR, not
          # stdout. Without 2>&1 `out` is empty and the assertions below fail —
          # this is what kept secure-agent-kali red on every build after the
          # 2026-05-19 v2-bridge cutover.
          out=$(docker exec kali-smoke /home/claude/.local/bin/fr-bridge --dry-run 2>&1)
          echo "$out"
          echo "$out" | head -1 | grep -qE '^\[bridge\] - v[0-9]+\.[0-9]+\.[0-9]+ - '
          echo "$out" | grep -q 'fr_dispatch: dry-run complete'

          docker logs kali-smoke
          docker rm -f kali-smoke

  smoke-test-paperclip-shell:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PAPERCLIP_SHELL_IMAGE: ghcr.io/derio-net/paperclip-shell
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — s6-overlay /init under K8s-equivalent securityContext
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # Match the live paperclip-shell securityContext (runAsUser: 1000,
          # cap-drop=ALL, no-new-privileges) so the s6-overlay preinit hits the
          # same /run constraints it does in K8s.
          mkdir -p /tmp/paperclip-shell-home /tmp/paperclip-shell-inventory
          sudo chown 1000:1000 /tmp/paperclip-shell-home /tmp/paperclip-shell-inventory
          # Empty inventory — first-deploy posture. The installer should report
          # "0 installed" and exit clean, not block sshd.
          echo '{}' | sudo tee /tmp/paperclip-shell-inventory/inventory.yaml >/dev/null
          sudo chown 1000:1000 /tmp/paperclip-shell-inventory/inventory.yaml

          docker run -d --name paperclip-shell-smoke \
            --user 1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -v /tmp/paperclip-shell-home:/home/agent \
            -v /tmp/paperclip-shell-inventory:/etc/paperclip-shell:ro \
            "${PAPERCLIP_SHELL_IMAGE}:${IMAGE_SHA}"

          # /init must reach stage 2 (sshd up). 30s budget mirrors kali smoke.
          for i in $(seq 1 30); do
            if docker exec paperclip-shell-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
              echo "✓ s6-overlay started, sshd is up"
              break
            fi
            sleep 1
          done
          if ! docker exec paperclip-shell-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
            echo "✗ sshd never came up within 30s"
            docker logs paperclip-shell-smoke
            docker rm -f paperclip-shell-smoke
            exit 1
          fi

          # Layer-1 managers must be on PATH and runnable as the agent UID.
          docker exec paperclip-shell-smoke mise --version
          docker exec paperclip-shell-smoke rustup --version
          docker exec paperclip-shell-smoke pipx --version
          docker exec paperclip-shell-smoke python3 --version

          # Inventory installer must exist on PATH and rerun cleanly with empty inventory.
          docker exec paperclip-shell-smoke /usr/local/bin/paperclip-shell-reconcile

          # Boot-time reconcile log must show the empty-inventory clean exit.
          docker exec paperclip-shell-smoke cat /var/log/cont-init.d/40-shell-inventory.log

          # MOTD drop-in must have been written and contain a recognizable summary.
          docker exec paperclip-shell-smoke cat /var/lib/paperclip-shell/last-reconcile.motd

          # Two-arm regression guard (issue #56): a populated inventory on a fresh
          # PV must reconcile clean. Pre-fix, arm 1 produced npm EACCES (mise shim
          # fell through to /usr/bin/npm against the root-owned /usr prefix); arm 2
          # regressed once python@ activated and the script's bare `python3`
          # resolved to mise's PyYAML-less Python. Package choices are deliberate:
          # is-odd is NOT baked into the image (claude-code is, and would short-
          # circuit to `already`), and python@3.12 forces arm 2's path. The write
          # needs `docker exec -i` to attach the heredoc on stdin.
          docker exec -i paperclip-shell-smoke sh -c 'cat >/tmp/inv.yaml' <<'YAML'
          mise:
            - node@20
            - python@3.12
          npm-global:
            - is-odd
          YAML
          out=$(docker exec -e INVENTORY=/tmp/inv.yaml paperclip-shell-smoke \
                  /usr/local/bin/paperclip-shell-reconcile 2>&1)
          echo "$out"
          # A ✓ install line proves BOTH arms: yaml parsing found the package
          # (arm 2 didn't silently empty the list) AND the active npm dispatched to
          # a writable prefix without EACCES (arm 1). Pre-fix this is `✗ … (rc=…)`
          # or absent entirely. Defer the verdict until after cleanup so a failing
          # assertion names itself and does not leak the smoke container.
          guard_ok=1
          echo "$out" | grep -q '✓ npm i -g is-odd' || { echo "✗ #56 arm1: no '✓ npm i -g is-odd' (EACCES fall-through, or arm-2 emptied the parse)"; guard_ok=0; }
          echo "$out" | grep -q 'failed=0'           || { echo "✗ #56: reconcile reported failed>0"; guard_ok=0; }
          echo "$out" | grep -qi "No module named 'yaml'" && { echo "✗ #56 arm2: PyYAML regression after python@ activation"; guard_ok=0; }

          docker logs paperclip-shell-smoke
          docker rm -f paperclip-shell-smoke
          [ "$guard_ok" -eq 1 ] || exit 1

  smoke-test-ruflo-shell:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RUFLO_SHELL_IMAGE: ghcr.io/derio-net/ruflo-shell
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — s6-overlay /init under K8s-equivalent securityContext
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # Match the live ruflo-shell securityContext (runAsUser: 1000,
          # cap-drop=ALL, no-new-privileges) so the s6-overlay preinit hits the
          # same /run constraints it does in K8s.
          mkdir -p /tmp/ruflo-shell-home /tmp/ruflo-shell-inventory
          sudo chown 1000:1000 /tmp/ruflo-shell-home /tmp/ruflo-shell-inventory
          # Empty inventory — first-deploy posture. The installer should report
          # "0 installed" and exit clean, not block sshd.
          echo '{}' | sudo tee /tmp/ruflo-shell-inventory/inventory.yaml >/dev/null
          sudo chown 1000:1000 /tmp/ruflo-shell-inventory/inventory.yaml

          docker run -d --name ruflo-shell-smoke \
            --user 1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -v /tmp/ruflo-shell-home:/home/agent \
            -v /tmp/ruflo-shell-inventory:/etc/ruflo-shell:ro \
            "${RUFLO_SHELL_IMAGE}:${IMAGE_SHA}"

          # /init must reach stage 2 (sshd up). 30s budget mirrors paperclip smoke.
          for i in $(seq 1 30); do
            if docker exec ruflo-shell-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
              echo "✓ s6-overlay started, sshd is up"
              break
            fi
            sleep 1
          done
          if ! docker exec ruflo-shell-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
            echo "✗ sshd never came up within 30s"
            docker logs ruflo-shell-smoke
            docker rm -f ruflo-shell-smoke
            exit 1
          fi

          # Layer-1 managers must be on PATH and runnable as the agent UID.
          docker exec ruflo-shell-smoke mise --version
          docker exec ruflo-shell-smoke rustup --version
          docker exec ruflo-shell-smoke pipx --version
          docker exec ruflo-shell-smoke python3 --version

          # claude-code is baked in — must be on PATH from a fresh SSH session.
          docker exec ruflo-shell-smoke claude --version

          # Inventory installer must exist on PATH and rerun cleanly with empty inventory.
          docker exec ruflo-shell-smoke /usr/local/bin/ruflo-shell-reconcile

          # Boot-time reconcile log must show the empty-inventory clean exit.
          docker exec ruflo-shell-smoke cat /var/log/cont-init.d/40-shell-inventory.log

          # MOTD drop-in must have been written and contain a recognizable summary.
          docker exec ruflo-shell-smoke cat /var/lib/ruflo-shell/last-reconcile.motd

          # Banner profile.d drop-in must be present (sourced by /etc/profile on
          # SSH login; we only assert the file is in place and runnable here).
          docker exec ruflo-shell-smoke test -x /etc/profile.d/60-ruflo-shell-banner.sh

          # Two-arm regression guard (issue #56): a populated inventory on a fresh
          # PV must reconcile clean. Pre-fix, arm 1 produced npm EACCES (mise shim
          # fell through to /usr/bin/npm against the root-owned /usr prefix); arm 2
          # regressed once python@ activated and the script's bare `python3`
          # resolved to mise's PyYAML-less Python. Package choices are deliberate:
          # is-odd is NOT baked into the image (claude-code is, and would short-
          # circuit to `already`), and python@3.12 forces arm 2's path. The write
          # needs `docker exec -i` to attach the heredoc on stdin.
          docker exec -i ruflo-shell-smoke sh -c 'cat >/tmp/inv.yaml' <<'YAML'
          mise:
            - node@20
            - python@3.12
          npm-global:
            - is-odd
          YAML
          out=$(docker exec -e INVENTORY=/tmp/inv.yaml ruflo-shell-smoke \
                  /usr/local/bin/ruflo-shell-reconcile 2>&1)
          echo "$out"
          # A ✓ install line proves BOTH arms: yaml parsing found the package
          # (arm 2 didn't silently empty the list) AND the active npm dispatched to
          # a writable prefix without EACCES (arm 1). Pre-fix this is `✗ … (rc=…)`
          # or absent entirely. Defer the verdict until after cleanup so a failing
          # assertion names itself and does not leak the smoke container.
          guard_ok=1
          echo "$out" | grep -q '✓ npm i -g is-odd' || { echo "✗ #56 arm1: no '✓ npm i -g is-odd' (EACCES fall-through, or arm-2 emptied the parse)"; guard_ok=0; }
          echo "$out" | grep -q 'failed=0'           || { echo "✗ #56: reconcile reported failed>0"; guard_ok=0; }
          echo "$out" | grep -qi "No module named 'yaml'" && { echo "✗ #56 arm2: PyYAML regression after python@ activation"; guard_ok=0; }

          docker logs ruflo-shell-smoke
          docker rm -f ruflo-shell-smoke
          [ "$guard_ok" -eq 1 ] || exit 1

  smoke-test-ruflo-server:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RUFLO_SERVER_IMAGE: ghcr.io/derio-net/ruflo-server
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — ruvocal boots and binds port 3000
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # Ruvocal connects to the database lazily on first request; the HTTP
          # server binds 3000 at startup regardless of DB availability. Smoke
          # test asserts: container stays running, port 3000 is reachable, and
          # / returns any HTTP status (1xx-5xx — anything but no-conn).
          # `curl -sS -o /dev/null -w "%{http_code}"` exits 0 even on
          # connection-refused (it just writes "000" to stdout), so we drive
          # the success/failure decision purely off the body, not curl's rc.
          docker run -d --name ruflo-server-smoke \
            --user 1000:1000 \
            -p 13000:3000 \
            "${RUFLO_SERVER_IMAGE}:${IMAGE_SHA}"

          status=000
          for i in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:13000/ 2>/dev/null || echo "000")
            if [[ "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "✓ ruvocal answered HTTP $status after ${i}s"
              break
            fi
            sleep 1
          done

          if ! [[ "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
            echo "✗ ruvocal never bound port 3000 (last status: $status)"
            docker logs ruflo-server-smoke
            docker rm -f ruflo-server-smoke
            exit 1
          fi

          # Container must still be running (didn't crash post-bind).
          if ! docker inspect -f '{{.State.Running}}' ruflo-server-smoke | grep -q true; then
            echo "✗ container exited after binding"
            docker logs ruflo-server-smoke
            docker rm -f ruflo-server-smoke
            exit 1
          fi

          docker logs ruflo-server-smoke | tail -50
          docker rm -f ruflo-server-smoke

  smoke-test-multi-agent-shell:
    needs: build-multi-agent-shell
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      MULTI_AGENT_SHELL_IMAGE: ghcr.io/derio-net/multi-agent-shell
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — s6-overlay /init under K8s-equivalent securityContext
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # Match the live K8s securityContext (runAsUser: 1000, cap-drop=ALL,
          # no-new-privileges) so the s6-overlay preinit hits the same /run
          # constraints it does on Frank.
          mkdir -p /tmp/mas-home /tmp/mas-inventory
          sudo chown 1000:1000 /tmp/mas-home /tmp/mas-inventory
          # Empty inventory — first-deploy posture per the multi-harness
          # standard's "Smoke testing" section. Installer must report 0
          # installed and exit clean; sshd must come up regardless.
          echo '{}' | sudo tee /tmp/mas-inventory/inventory.yaml >/dev/null
          sudo chown 1000:1000 /tmp/mas-inventory/inventory.yaml

          docker run -d --name mas-smoke \
            --user 1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -v /tmp/mas-home:/home/agent \
            -v /tmp/mas-inventory:/etc/multi-agent-shell:ro \
            "${MULTI_AGENT_SHELL_IMAGE}:${IMAGE_SHA}"

          # /init must reach stage 2 (sshd up). 30s budget mirrors paperclip-shell.
          for i in $(seq 1 30); do
            if docker exec mas-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
              echo "✓ s6-overlay started, sshd is up"
              break
            fi
            sleep 1
          done
          if ! docker exec mas-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
            echo "✗ sshd never came up within 30s"
            docker logs mas-smoke
            docker rm -f mas-smoke
            exit 1
          fi

          # Layer-1 managers must be on PATH and runnable as the agent UID.
          docker exec mas-smoke mise --version
          docker exec mas-smoke rustup --version
          docker exec mas-smoke pipx --version
          docker exec mas-smoke python3 --version
          docker exec mas-smoke yq --version
          docker exec mas-smoke jq --version

          # Multi-harness manifest assertion (per docs/standards/multi-harness-shells.md
          # § "Smoke testing"): every harness in the image's manifest reports
          # --version cleanly as UID 1000. claude inherited from agent-base;
          # codex/agy/opencode baked here.
          for h in claude codex agy opencode; do
            echo "::group::$h --version"
            docker exec mas-smoke "$h" --version
            echo "::endgroup::"
          done

          # agent-session contract (Part A): the baked driver is on PATH, the
          # s6 longrun is present + gated on AGENT_SESSION_SERVE, and
          # `agent-session serve` binds 127.0.0.1 cleanly. A clean bind keeps
          # serving until `timeout` kills it at 2s (rc 124 = success); a bind
          # failure raises and exits non-124 fast.
          docker exec mas-smoke bash -lc 'command -v agent-session'
          docker exec mas-smoke test -x /etc/services.d/agent-session-server/run
          docker exec mas-smoke grep -q AGENT_SESSION_SERVE /etc/services.d/agent-session-server/run
          docker exec mas-smoke bash -lc 'timeout 2 agent-session serve; rc=$?; [ "$rc" = 124 ] || { echo "✗ agent-session serve did not bind+stay up (rc=$rc)"; exit 1; }'
          echo "✓ agent-session on PATH, s6 service gated, serve binds"

          # Inventory installer reconciles cleanly against the empty inventory
          # and writes a MOTD drop-in. failed=0 proves no section errored.
          docker exec mas-smoke /usr/local/bin/multi-agent-shell-reconcile
          out=$(docker exec mas-smoke cat /var/log/cont-init.d/40-shell-inventory.log)
          echo "$out"
          echo "$out" | grep -q 'failed=0' || { echo "✗ empty-inventory reconcile reported failed>0"; docker rm -f mas-smoke; exit 1; }
          docker exec mas-smoke test -s /var/lib/multi-agent-shell/last-reconcile.motd

          # Auth-status MOTD drop-in must be present and executable. We don't
          # assert content here — credentials are runtime, not CI — only that
          # the script is in place and runs cleanly with empty $HOME.
          docker exec mas-smoke test -x /etc/profile.d/50-multi-agent-shell-motd.sh
          docker exec mas-smoke /etc/profile.d/50-multi-agent-shell-motd.sh | grep -q '✗ claude'

          # Reconcile two new schema keys end-to-end against a populated
          # inventory: mcp-servers merges into ~/.claude/mcp.json; harnesses:
          # latest invokes the inherited `claude update` self-update path.
          docker exec -i mas-smoke sh -c 'cat >/tmp/inv.yaml' <<'YAML'
          harnesses:
            claude: latest
          mcp-servers:
            claude:
              - name: context7
                command: npx
                args: ["-y", "@upstash/context7-mcp"]
          YAML
          out=$(docker exec -e INVENTORY=/tmp/inv.yaml mas-smoke \
                  /usr/local/bin/multi-agent-shell-reconcile 2>&1)
          echo "$out"
          guard_ok=1
          echo "$out" | grep -q 'mcp-servers/claude reconciled' || { echo "✗ mcp-servers section did not run"; guard_ok=0; }
          docker exec mas-smoke jq -e '.mcpServers.context7.command == "npx"' /home/agent/.claude/mcp.json >/dev/null || { echo "✗ mcp.json not merged correctly"; guard_ok=0; }

          docker logs mas-smoke
          docker rm -f mas-smoke
          [ "$guard_ok" -eq 1 ] || exit 1

  smoke-test-hermes-agent-shell:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HERMES_AGENT_SHELL_IMAGE: ghcr.io/derio-net/hermes-agent-shell
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — s6-overlay /init under K8s-equivalent securityContext
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # Match the live K8s securityContext (runAsUser: 1000, cap-drop=ALL,
          # no-new-privileges) so the s6-overlay preinit hits the same /run
          # constraints it does on Frank.
          mkdir -p /tmp/has-home /tmp/has-inventory
          sudo chown 1000:1000 /tmp/has-home /tmp/has-inventory
          # Empty inventory — first-deploy posture per the multi-harness
          # standard's "Smoke testing" section. Installer must report 0
          # installed and exit clean; sshd must come up regardless. hermes is
          # a single-harness leaf with no subscription/OAuth flow, so the
          # inventory is expected to stay sparse in practice.
          echo '{}' | sudo tee /tmp/has-inventory/inventory.yaml >/dev/null
          sudo chown 1000:1000 /tmp/has-inventory/inventory.yaml

          docker run -d --name has-smoke \
            --user 1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -v /tmp/has-home:/home/agent \
            -v /tmp/has-inventory:/etc/hermes-agent-shell:ro \
            "${HERMES_AGENT_SHELL_IMAGE}:${IMAGE_SHA}"

          # /init must reach stage 2 (sshd up). 30s budget mirrors paperclip-shell.
          for i in $(seq 1 30); do
            if docker exec has-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
              echo "✓ s6-overlay started, sshd is up"
              break
            fi
            sleep 1
          done
          if ! docker exec has-smoke /command/s6-svstat /run/service/sshd 2>/dev/null | grep -q '^up'; then
            echo "✗ sshd never came up within 30s"
            docker logs has-smoke
            docker rm -f has-smoke
            exit 1
          fi

          # Single-harness manifest assertion (per
          # docs/standards/multi-harness-shells.md § "Smoke testing"):
          # `hermes --version` runs cleanly as UID 1000. This now resolves
          # through /usr/local/bin/hermes → the PVC venv that
          # cont-init.d/35-hermes-venv-seed copied from the relocatable seed,
          # so a green `--version` also proves the relocatable copy works.
          docker exec has-smoke hermes --version

          # Runtime prerequisites used by hermes-brain maintenance and general
          # operator workflows must remain present in the shell image. In
          # particular, rsync backs the hermes-brain sync/snapshot scripts and
          # gh provides the documented git-credential helper path used across
          # derio-net repos.
          docker exec has-smoke sh -c 'command -v rsync >/dev/null'
          docker exec has-smoke sh -c 'command -v gh >/dev/null'

          # frank#496 — PVC-resident venv: the live venv must be on the PVC,
          # uid-1000-owned and WRITABLE (the whole point: the in-pod operator
          # can patch Hermes in place). The image seed at /opt is just a
          # template.
          # NB: $LIVE/bin/python is a symlink to the (root-owned) base
          # interpreter, so `test -w` on it would follow the link and mislead.
          # Assert writability on what the operator actually patches: the venv
          # dir and a real site-packages file.
          LIVE=/home/agent/.local/opt/hermes-agent
          CL="$LIVE/lib/python3.11/site-packages/agent/conversation_loop.py"
          docker exec has-smoke test -O "$LIVE/bin/hermes" \
            || { echo "✗ live venv hermes not owned by uid 1000"; docker logs has-smoke; docker rm -f has-smoke; exit 1; }
          docker exec has-smoke test -w "$CL" \
            || { echo "✗ live conversation_loop.py not writable by uid 1000"; docker rm -f has-smoke; exit 1; }
          docker exec has-smoke sh -c "touch $LIVE/.smoke-wtest && rm -f $LIVE/.smoke-wtest" \
            || { echo "✗ cannot write into live venv dir"; docker rm -f has-smoke; exit 1; }
          # The launcher must point at the PVC venv, not the /opt seed.
          docker exec has-smoke sh -c 'readlink -f "$(command -v hermes)"' | grep -q "^$LIVE/" \
            || { echo "✗ hermes launcher does not resolve into the PVC venv"; docker rm -f has-smoke; exit 1; }

          # frank#496 — the auto-continue patch is BAKED into the live venv:
          # the announce-only countermeasure gate is widened to chat_completions.
          docker exec has-smoke grep -q 'api_mode in ("codex_responses", "chat_completions")' "$CL" \
            || { echo "✗ auto-continue patch not present in live venv"; docker rm -f has-smoke; exit 1; }

          # Version-aware re-seed: a changed seed marker replaces the live venv.
          # Drop a sentinel + corrupt the live marker, re-run the hook, and
          # assert the venv was re-seeded (sentinel gone, marker restored).
          docker exec has-smoke sh -c "touch $LIVE/.smoke-sentinel && echo stale > $LIVE/.seed-version"
          # Invoke via `bash`, not directly: the hook's `#!/command/with-contenv
          # bash` shebang is an s6 execline wrapper that only resolves inside
          # supervised cont-init, not a bare `docker exec`. The hook needs no
          # container-env (it reads only SEED/LIVE, which default correctly).
          docker exec has-smoke bash /etc/cont-init.d/35-hermes-venv-seed
          docker exec has-smoke sh -c "! test -e $LIVE/.smoke-sentinel" \
            || { echo "✗ re-seed did not replace the live venv on version mismatch"; docker rm -f has-smoke; exit 1; }
          docker exec has-smoke sh -c "grep -q autocontinue1 $LIVE/.seed-version" \
            || { echo "✗ live seed marker not restored after re-seed"; docker rm -f has-smoke; exit 1; }
          echo "✓ frank#496: PVC venv writable, patch baked, version-aware re-seed OK"

          # Inventory installer reconciles cleanly against the empty inventory
          # and writes a MOTD drop-in. failed=0 proves no section errored.
          docker exec has-smoke /usr/local/bin/hermes-agent-shell-reconcile
          out=$(docker exec has-smoke cat /var/log/cont-init.d/40-shell-inventory.log)
          echo "$out"
          echo "$out" | grep -q 'failed=0' || { echo "✗ empty-inventory reconcile reported failed>0"; docker rm -f has-smoke; exit 1; }
          docker exec has-smoke test -s /var/lib/hermes-agent-shell/last-reconcile.motd

          # BYOK MOTD drop-in must be present, executable, and emit the
          # `(BYOK — no login flow)` row that the standard's exception
          # mandates for hermes. We don't assert OPENAI_BASE_URL contents
          # here — that env is Frank/ESO's responsibility, not the image's.
          docker exec has-smoke test -x /etc/profile.d/50-hermes-agent-shell-motd.sh
          docker exec has-smoke /etc/profile.d/50-hermes-agent-shell-motd.sh | grep -q '~ hermes'

          docker logs has-smoke
          docker rm -f has-smoke

  smoke-test-hermes-agent-shell-ssh:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HERMES_SSH_IMAGE: ghcr.io/derio-net/hermes-agent-shell-ssh
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — sshd sidecar binds 2222 under K8s-equivalent securityContext
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # This sidecar does NOT run s6-overlay (unlike the shell-base images) —
          # it runs sshd in the foreground as PID 1 via a custom entrypoint
          # (hermes-ssh-sidecar-entrypoint.sh). So the readiness signal is
          # "sshd wrote its PidFile / bound 2222", not "s6-svstat sshd up".
          #
          # Match the live pod securityContext (runAsUser 1000, cap-drop=ALL,
          # no-new-privileges): the non-root sshd must bind 2222 without ever
          # chowning /run at runtime (it pre-chowns /run/sshd at build time). The
          # bind mounts stand in for the pod's PVCs (fsGroup:1000). The live pod
          # mounts TWO volumes — the data PVC at /opt/data AND the tool-home PVC
          # at /opt/data/home — so the smoke must too. The official base declares
          # `VOLUME /opt/data` (HERMES_HOME=/opt/data), and a single 1000-owned
          # bind at /opt/data alone leaves /opt/data/home NOT agent-writable, so
          # the entrypoint's first-boot `mkdir ~/.ssh-host-keys` dies Permission
          # denied (this smoke never ran until kali unblocked build-children, so
          # the gap only surfaced now). Mounting /opt/data/home explicitly, 1000-
          # owned like its PVC, is what makes the host-key + sshd.pid writes work
          # as UID 1000.
          mkdir -p /tmp/hermes-ssh-optdata /tmp/hermes-ssh-home
          sudo chown 1000:1000 /tmp/hermes-ssh-optdata /tmp/hermes-ssh-home

          docker run -d --name hermes-ssh-smoke \
            --user 1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -p 12222:2222 \
            -v /tmp/hermes-ssh-optdata:/opt/data \
            -v /tmp/hermes-ssh-home:/opt/data/home \
            "${HERMES_SSH_IMAGE}:${IMAGE_SHA}"

          # First boot generates host keys (incl. rsa-4096, a couple seconds) then
          # execs sshd, which writes its PidFile onto the shared PVC. 30s budget
          # mirrors the sibling shells.
          ready=0
          for i in $(seq 1 30); do
            if docker exec hermes-ssh-smoke test -f /opt/data/home/.ssh/sshd.pid 2>/dev/null; then
              echo "✓ sshd wrote its PidFile after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "✗ sshd never wrote its PidFile within 30s"
            docker logs hermes-ssh-smoke
            docker rm -f hermes-ssh-smoke
            exit 1
          fi

          # Host keys must land on the shared PVC (persist across restarts, same
          # mechanism agent-shell-base's 10-ssh-host-keys uses).
          docker exec hermes-ssh-smoke test -f /opt/data/home/.ssh-host-keys/ssh_host_ed25519_key \
            || { echo "✗ ed25519 host key not generated on the PVC"; docker logs hermes-ssh-smoke; docker rm -f hermes-ssh-smoke; exit 1; }

          # The port must actually accept TCP and speak the SSH protocol — proves
          # the non-root sshd bound 2222 under cap-drop=ALL (the sshd_config
          # comment's claim), not merely that some process is up.
          bound=0
          for i in $(seq 1 15); do
            if banner=$(timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/12222; head -c 20 <&3' 2>/dev/null); then
              echo "banner: ${banner}"
              if echo "$banner" | grep -q '^SSH-2.0'; then
                echo "✓ sshd is speaking SSH on 2222"
                bound=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$bound" -ne 1 ]; then
            echo "✗ sshd never answered with an SSH banner on 2222"
            docker logs hermes-ssh-smoke
            docker rm -f hermes-ssh-smoke
            exit 1
          fi

          # The whole point of building FROM the official Hermes tag: the `hermes`
          # CLI invoked over SSH is byte-for-byte the gateway's runtime and shares
          # /opt/data. Assert it runs cleanly as UID 1000 in the sidecar.
          docker exec hermes-ssh-smoke hermes --version \
            || { echo "✗ hermes CLI not runnable as UID 1000 in the sidecar"; docker logs hermes-ssh-smoke; docker rm -f hermes-ssh-smoke; exit 1; }

          docker logs hermes-ssh-smoke
          docker rm -f hermes-ssh-smoke

  smoke-test-hermes-agent-shell-hindsight:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HINDSIGHT_IMAGE: ghcr.io/derio-net/hermes-agent-shell-hindsight
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test — PG + hindsight-api boot on an empty PVC, offline, under K8s securityContext
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # Match the live sidecar securityContext (runAsUser:1000, cap-drop=ALL,
          # no-new-privileges). The PVC is emulated by a host dir chowned to 1000
          # (the fsGroup:1000 equivalent) mounted at /opt/hindsight, so the
          # cont-init initdb can write PGDATA as the agent UID on an empty volume.
          #
          # --network none proves the embedding model loads OFFLINE from the baked
          # HF cache (no huggingface.co fetch) and that PG/api need only loopback.
          # Retain is unset here, so the run script defaults LLM_PROVIDER=none —
          # no LLM client, no egress.
          mkdir -p /tmp/hindsight-data
          sudo chown 1000:1000 /tmp/hindsight-data
          docker run -d --name hindsight-smoke \
            --user 1000:1000 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --network none \
            -v /tmp/hindsight-data:/opt/hindsight \
            "${HINDSIGHT_IMAGE}:${IMAGE_SHA}"

          # First boot does initdb + torch import + Alembic migrations + model
          # load, so budget generously.
          ok=0
          for i in $(seq 1 180); do
            code=$(docker exec hindsight-smoke \
              curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/health 2>/dev/null || echo 000)
            if [ "$code" = 200 ]; then ok=1; echo "✓ /health 200 after ${i}s"; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "✗ hindsight-api /health never returned 200 within 180s"
            docker logs hindsight-smoke
            docker rm -f hindsight-smoke
            exit 1
          fi

          # DB connected → Alembic migrations ran on the freshly-initdb'd empty
          # PVC (proves pgvector + schema creation work end-to-end).
          docker exec hindsight-smoke \
            curl -s http://127.0.0.1:8888/health | grep -q '"database":"connected"' \
            || { echo "✗ /health did not report database connected"; docker logs hindsight-smoke; docker rm -f hindsight-smoke; exit 1; }

          # initdb initialized the empty volume (idempotent path).
          docker exec hindsight-smoke test -s /opt/hindsight/pgdata/PG_VERSION \
            || { echo "✗ initdb did not initialize /opt/hindsight/pgdata"; docker rm -f hindsight-smoke; exit 1; }

          # Postgres accepts loopback connections on :5433.
          docker exec hindsight-smoke \
            /opt/micromamba/envs/hindsight-pg/bin/pg_isready -h 127.0.0.1 -p 5433 \
            || { echo "✗ postgres not ready on 127.0.0.1:5433"; docker rm -f hindsight-smoke; exit 1; }

          # pgvector extension present (hindsight-api's CREATE EXTENSION vector succeeded).
          docker exec hindsight-smoke \
            /opt/micromamba/envs/hindsight-pg/bin/psql -h 127.0.0.1 -p 5433 -U hindsight -d postgres \
            -tAc "select extname from pg_extension where extname='vector'" | grep -q vector \
            || { echo "✗ pgvector extension not installed"; docker logs hindsight-smoke; docker rm -f hindsight-smoke; exit 1; }

          echo "✓ hindsight sidecar: PG 18 + pgvector up, api healthy, model loaded offline"
          docker logs hindsight-smoke | tail -40
          docker rm -f hindsight-smoke

  smoke-test-infra-shell:
    needs: build-children
    runs-on: ubuntu-latest
    permissions:
