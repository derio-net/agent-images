[project]
name = "agent-images"
version = "0.1.0"
description = "Shared base image and per-pod child images for secure agent pods"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "smoke: opt-in tests that exercise a built container image (need KALI_IMAGE / docker)",
]
