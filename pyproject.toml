[project]
name = "agent-images"
version = "0.1.0"
description = "Shared base image and per-pod child images for secure agent pods"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "smoke: container smoke tests requiring a freshly-built image (gated; run with `-m smoke`)",
]
# Default test run excludes smoke tests — they need a built docker image.
addopts = "-m 'not smoke'"
