  - {id: f-2, state: fixed, body: "R5 now limits 'still resumes' to claude; Design §Conversation cost and R6 state that non-claude profiles start fresh each turn unless they send end_session:false. This stays within decision fence-on-everywhere, since frank's consumers all drive claude."}
