  - {id: f-4, state: fixed, body: "Added seams HINDSIGHT_HALT, S6_RESULTS_DIR and S6_HALT, a unit test for the helper, and the helper in the chmod list; callers exit after halting."}
  - {id: f-5, state: fixed, body: "Added a pre-bump Test Plan row (operator-driven, before frank's bump merges): check for a stray 5433 holder, dump and restore what hindsight wrote there, then stop it."}
  - {id: f-6, state: fixed, body: "Dropped the 'Test Plan exercises R4 on frank' claim. R4 now points at the identity unit tests and the give-up smoke step, and the hindsight-giveup-halts verification line names R4."}
  - {id: f-7, state: fixed, body: "Halt-container is now scoped to the two longrun paths. The pre-flight exit code is documented as s6's stage-2 code, which the smoke step records via docker inspect, with N pinned at 60s."}
  - {id: f-8, state: fixed, body: "The identity check now uses psql -X -w with PGCONNECT_TIMEOUT=5 and LC_ALL=C pg_controldata. Non-zero exit or empty output is the unreadable branch, and exit follows the halt."}
  - {id: f-9, state: fixed, body: "The guard regex is now specified (extras optional, separator == or whitespace), with at least one match required per file."}
  - {id: f-10, state: fixed, body: "The give-up smoke setup is specified: a first run initdbs and is stopped, then the bad GUC is appended as UID 1000, then a second run (not --rm) must reach ExitCode 125 within 150s with at most 6 failures."}
  - {id: f-11, state: fixed, body: "Housekeeping now says the plan's phase 6 is already ticked. What remains is the run cursor's phase-6 unit, phase 7, journal-check and deliver; the archive target is docs/superpowers/implemented/plans/."}
