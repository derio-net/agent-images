rows:
  - id: hindsight-port-preflight
    capability: hindsight sidecar boot safety
    acceptance: When something already listens on 127.0.0.1:5433, the hindsight container
      fails boot naming the port and exits non-zero without starting a postmaster.
    origin:
    - spec:2026-11-14-hindsight-giveup-signal#R1
    levels: {}
    status: unwired
    notes: Unit tests exist and pass locally (deliver log). The repo is ci none, so
      build.yaml's pytest/smoke jobs run only on push to main or dispatch; the branch
      build covers them pre-merge (#170).
    verify: none
  - id: hindsight-identity-check
    capability: hindsight sidecar boot safety
    acceptance: hindsight-api starts only when the postgres on 127.0.0.1:5433 is the
      cluster in our PGDATA (matching system identifier); otherwise it refuses, says
      why, and the container exits non-zero.
    origin:
    - spec:2026-11-14-hindsight-giveup-signal#R2
    - spec:2026-11-14-hindsight-giveup-signal#R4
    levels: {}
    status: unwired
    notes: Unit tests exist and pass locally (deliver log). The repo is ci none, so
      build.yaml's pytest/smoke jobs run only on push to main or dispatch; the branch
      build covers them pre-merge (#170).
    verify: none
  - id: hindsight-giveup-halts
    capability: hindsight sidecar boot safety
    acceptance: When postgres exhausts its bounded restart backoff, the hindsight container
      exits non-zero (so the pod shows restarts) instead of staying up with postgres
      down, and /health never answers healthy meanwhile.
    origin:
    - spec:2026-11-14-hindsight-giveup-signal#R3
    - spec:2026-11-14-hindsight-giveup-signal#R4
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: agent-session-fence-default
    capability: agent-session exactly-once turns
    acceptance: Every agent-session send path (legacy /session/send, /v1/session/send,
      the send CLI) ends the harness session after the turn by default; only end_session:false
      keeps it, and the next send resumes the same conversation.
    origin:
    - spec:2026-11-14-hindsight-giveup-signal#R5
    - spec:2026-11-14-hindsight-giveup-signal#R6
    levels: {}
    status: not-implemented
    notes: ''
